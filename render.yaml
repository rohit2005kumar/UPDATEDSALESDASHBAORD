services:
  - type: web
    name: ayudravya-sales-dashboard
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SALES_API_BASE_URL
        value: https://ayudravya-sales-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
